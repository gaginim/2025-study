spring:
  profiles:
    active: local
    group:
      local: common, local
      dev: common, dev
---
spring:
  config:
    activate:
      on-profile: common
    import:
      - classpath:database.yaml
  application:
    name: study
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
logging:
  log4j2:
    config:
      override: classpath:log4j2/log4j2-base.xml, classpath:log4j2/log4j2-${spring.profiles.active}.xml
mysql:
  username: tommy
  password: password
---
spring:
  config:
    activate:
      on-profile: local
    import:
      - classpath:database.yaml
server:
  port: 4298
---
spring:
  config:
    activate:
      on-profile: dev
    import:
      - classpath:database.yaml
      - classpath:vault.yaml
server:
  port: 4298
