server:
  port: 8000

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://127.0.0.1:8761/eureka

spring:
  application:
    name: discovery-gateway
  cloud:
    gateway:
      routes:
        - id: first-service
          uri: http://localhost:6001
          predicates:
            - Path=/first-service/**
          filters:
            - RewritePath=/second-service/?(?<segment>.*), /$\{segment}
        - id: second-service
          uri: http://localhost:6002
          predicates:
            - Path=/second-service/**
          filters:
            - RewritePath=/second-service/?(?<segment>.*), /$\{segment}
